appId: com.fcpb6403.opencode-costs-viewer
productName: Opencode Costs Viewer
asar: true
directories:
  buildResources: src-tauri/icons
  output: release
files:
  - dist-electron/**/*
  - dist-electron-renderer/**/*
  - package.json
extraResources:
  - from: src-dotnet/publish/backend
    to: backend
    filter:
      - "**/*"
      - "!**/*.pdb"
win:
  icon: src-tauri/icons/icon.ico
  target:
    - nsis
    - msi
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Opencode Costs Viewer
  deleteAppDataOnUninstall: false
msi:
  oneClick: true
  perMachine: true
  upgradeCode: "{CCC7CE0A-1B08-4CF1-9A31-2DAA5385CD29}"
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Opencode Costs Viewer
  runAfterFinish: false
mac:
  icon: src-tauri/icons/icon.icns
  target:
    - dmg
dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  icon: src-tauri/icons/128x128.png
  executableName: opencode-costs-viewer
  category: Utility
  target:
    - deb
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libsqlite3-0
