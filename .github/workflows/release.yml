name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            extra_args: ""
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            extra_args: ""
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            extra_args: --config src-tauri/tauri.windows.conf.json
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extra_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run release script tests
        run: npm run test:release

      - name: Run backend tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Generate and validate pricing catalog
        run: npm run release:prepare

      - name: Build frontend
        run: npm run build

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            Téléchargez l'installateur correspondant à votre système.

            Ces bundles ne sont pas signés. macOS et Windows peuvent afficher un avertissement de sécurité au premier lancement.
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }} ${{ matrix.extra_args }}
