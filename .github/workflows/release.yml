name: Release desktop bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release GitHub à construire"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ALLOW_RELEASE_REPLACE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            name: Windows x64 (NSIS + MSI)
            os: windows-latest
            rid: win-x64
            electron_args: --win --x64
          - id: macos-arm64
            name: macOS Apple Silicon DMG
            os: macos-15
            rid: osx-arm64
            electron_args: --mac --arm64
          - id: macos-x64
            name: macOS Intel DMG
            os: macos-15-intel
            rid: osx-x64
            electron_args: --mac --x64
          - id: linux-x64
            name: Linux x64 deb
            os: ubuntu-22.04
            rid: linux-x64
            electron_args: --linux --x64
    env:
      DOTNET_RID: ${{ matrix.rid }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux SQLite runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libuuid1 libsecret-1-0 libsqlite3-0 xvfb

      - name: Install dependencies
        run: npm ci

      - name: Verify synchronized release versions
        run: node scripts/verify-release-version.mjs

      - name: Generate and validate pricing catalog
        run: npm run release:prepare

      - name: Build platform installers
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run desktop:package -- ${{ matrix.electron_args }}

      - name: Verify macOS signature and notarization when configured
        if: startsWith(matrix.id, 'macos-')
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          app=$(node -e "const fs=require('node:fs'),p=require('node:path');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{if(!e.isDirectory())return[];const f=p.join(d,e.name);return e.name.endsWith('.app')?[f]:walk(f)});process.stdout.write(walk('release')[0]??'')")
          if [[ -z "$app" ]]; then echo "Packaged .app not found"; exit 1; fi
          if [[ -n "$CSC_LINK" || -n "$CSC_NAME" ]]; then codesign --verify --deep --strict "$app"; else echo "No macOS signing identity configured; publishing unsigned app."; fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then xcrun stapler validate "$app"; fi

      - name: Verify Windows installer signatures when configured
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            Write-Host "No Windows signing certificate configured; publishing unsigned installers."
          } else {
            $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File) + @(Get-ChildItem -Path "release" -Filter "*.msi" -File)
            foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
              if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($installer.Name) ($($signature.Status))" }
            }
          }

      - name: Install, test, and remove Debian package
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-deb-installation.mjs

      - name: Install from DMG, test, and remove application
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-dmg.sh

      - name: Test Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installers.ps1

      - name: Upload platform installers
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.id }}
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download platform artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: desktop-*
          path: release-assets

      - name: Publish installers and verify completeness
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/publish-electron-release.mjs release-assets
